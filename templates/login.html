<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penilaian Risiko Kebakaran - Login</title>

    <!-- Theme detection before CSS — prevents flash -->
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            if ((saved ?? sys) === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>

    <link rel="stylesheet" href="/static/css/output.css">

    <style>
        :root {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
            --input-bg: #f8fafc;
            --input-bdr: #cbd5e1;
        }

        html.dark {
            --bg: #09090b;
            --card-bg: #18181b;
            --card-border: #27272a;
            --text: #e4e4e7;
            --muted: #71717a;
            --input-bg: #09090b;
            --input-bdr: #3f3f46;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            position: relative;
            overflow: hidden;
            transition: background-color 0.2s;
        }

        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24rem;
            height: 24rem;
            background: radial-gradient(circle, rgba(234, 88, 12, 0.12), transparent 70%);
            pointer-events: none;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 26rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 10;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .field {
            width: 100%;
            padding: 0.75rem 0.75rem 0.75rem 2.75rem;
            background: var(--input-bg);
            border: 1px solid var(--input-bdr);
            border-radius: 0.75rem;
            color: var(--text);
            font-size: 0.9375rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .field:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.25);
        }

        .field::placeholder {
            color: var(--muted);
        }
    </style>
</head>

<body>
    <div class="glow"></div>

    <!-- Theme toggle -->
    <button onclick="toggleTheme()"
        class="fixed top-4 right-4 z-20 w-9 h-9 rounded-full flex items-center justify-center transition"
        style="background:var(--card-bg); border:1px solid var(--card-border); color:var(--muted)" title="Toggle tema">
        <i id="login-theme-icon" class="ph ph-moon text-base"></i>
    </button>

    <div class="card">
        <!-- Icon -->
        <div class="flex justify-center mb-6">
            <div
                class="h-16 w-16 bg-gradient-to-br from-orange-400 to-red-600 rounded-2xl flex items-center justify-center shadow-lg transform rotate-3">
                <svg class="h-8 w-8 text-white -rotate-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 2C7 2 3 6.47 3 12c0 2.27.76 4.37 2.04 6.04L4 19.1V22h2.9l1.06-1.04A9.97 9.97 0 0 0 12 22c5.53 0 10-4.47 10-10S17.53 2 12 2z">
                    </path>
                </svg>
            </div>
        </div>

        <!-- Titles -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-tight mb-2">Portal Dasbor PBL</h1>
            <p class="text-sm" style="color:var(--muted)">
                Silakan masukkan identitas keamanan Anda untuk memantau sistem Risiko Kebakaran.
            </p>
        </div>

        <!-- Error -->
        {% if error %}
        <div
            class="bg-red-500/10 border border-red-500/50 text-red-500 text-sm font-semibold p-3 rounded-xl mb-6 text-center animate-pulse">
            {{ error }}
        </div>
        {% endif %}

        <!-- Form -->
        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-semibold mb-1.5 ml-1" style="color:var(--text)">
                    Username / ID Karyawan
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5" style="color:var(--muted)" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <input type="text" id="username" name="username" required autocomplete="username" class="field"
                        placeholder="Masukkan Username (admin)">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold mb-1.5 ml-1" style="color:var(--text)">
                    Kata Sandi Akses
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5" style="color:var(--muted)" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                    </div>
                    <input type="password" id="password" name="password" required class="field"
                        placeholder="Masukkan Sandi (admin)">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-400 hover:to-red-400 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-orange-500/30 transition-all active:scale-[0.98]">
                    Otorisasi Akses
                </button>
            </div>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center border-t pt-6" style="border-color:var(--card-border)">
            <p class="text-xs font-medium" style="color:var(--muted)">
                Tim Pengembang Sistem PBL<br>
                <span class="font-semibold mt-1 inline-block">Ervin &bull; Akmal &bull; Jascon &bull; Farhan</span>
            </p>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('login-theme-icon');
            if (icon) icon.className = isDark ? 'ph ph-moon text-base' : 'ph ph-sun text-base';
        }
        // Set correct icon on page load
        updateThemeIcon();
    </script>
    <!-- Phosphor Icons for the theme toggle button -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</body>

</html>
